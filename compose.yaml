
services:
  postgres:
    image: postgres:17
    container_name: lupita_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cafeteria_lupita
      POSTGRES_USER: lupita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lupita -d cafeteria_lupita"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: lupita_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@lupita.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Configura PGADMIN_PASSWORD}
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend/Lupita.Api
      dockerfile: Dockerfile

    container_name: lupitaAPI

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Jwt__Key: ${JWT_KEY:?Configura JWT_KEY de al menos 32 bytes}
      Seed__Enabled: ${SEED_ENABLED:-false}
      Seed__Passwords__lupita: ${SEED_PASSWORD_LUPITA:-}
      Seed__Passwords__lucia: ${SEED_PASSWORD_LUCIA:-}
      Seed__Passwords__angel: ${SEED_PASSWORD_ANGEL:-}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=cafeteria_lupita;Username=lupita;Password=${POSTGRES_PASSWORD}"

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
